server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:fooddb;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  main:
    allow-bean-definition-overriding: true

app:
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  sessions:
    afternoon:
      start: ${AFTERNOON_SESSION_START:13:00}
      end: ${AFTERNOON_SESSION_END:15:00}
    night:
      start: ${NIGHT_SESSION_START:20:00}
      end: ${NIGHT_SESSION_END:22:00}
  jwt:
    secret: ${JWT_SECRET:9263046773539828574921938563829102837561028374829384756283928475}
    expiration-ms: 86400000 # 24 hours
  ai:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  matching:
    max-route-deviation-km: ${MAX_ROUTE_DEVIATION_KM:2.0}
    max-volunteer-to-shelter-distance-km: ${MAX_VOLUNTEER_TO_SHELTER_DISTANCE_KM:5.0}
    min-match-distance-meters: ${MIN_MATCH_DISTANCE_METERS:100.0}
    gps-accuracy-threshold-meters: ${GPS_ACCURACY_THRESHOLD_METERS:50.0}
  delivery:
    geofence-radius-meters: ${DELIVERY_GEOFENCE_RADIUS_METERS:100.0}
